name: Update Naukri Profile

on:
  schedule:
    - cron: "*/5 * * * *" # Runs every 5 minutes
  workflow_dispatch: 

permissions:
  contents: read
# env:
#   # Opt into Node.js 24 for the runner environment now
#   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update_naukri:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install
      - name: Install Playwright Browsers
        run: npx playwright install chromium
      - name: Check Playwright Installation
        run: npx playwright --version
      # - name: "Decoder"
      #   shell: pwsh
      #   run: |
      #     .\decoder.ps1
          
      # - name: Run Naukri agent
      #   run: node agent.js
      #   env:
      #     NAUKRI_USER: ${{ secrets.NAUKRI_USER }}
      #     NAUKRI_PASS: ${{ secrets.NAUKRI_PASS }}
      #     COOKIE_PASSWORD: ${{ secrets.COOKIE_PASSWORD }}
      - name: Retry Step
        uses: nick-fields/retry@v3.0.2
        with:
          # Minutes to wait before attempt times out.  Must only specify either minutes or seconds
          timeout_minutes: 10
          # Number of attempts to make before failing the step
          max_attempts: 3
          # The command to run
          command: node agent.js
          # Number of seconds to wait before attempting the next retry
          retry_wait_seconds: 30
        env:
          NAUKRI_USER: ${{ secrets.NAUKRI_USER }}
          NAUKRI_PASS: ${{ secrets.NAUKRI_PASS }}
          COOKIE_PASSWORD: ${{ secrets.COOKIE_PASSWORD }}
      - name: "List directory"
        shell: pwsh
        run: |
          dir
        if: ${{ always() }}
      - name: Upload Screenshots
        uses: actions/upload-artifact@v7.0.1
        if: ${{ always() }}
        with:
          name: Naukri-screensots
          path: |
            **/*.png
            

         
          
        
